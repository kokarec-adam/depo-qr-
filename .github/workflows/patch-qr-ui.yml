name: One-time QR UI patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply QR patch
        run: python scripts/patch_qr.py
      - name: Commit and clean up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/patch_qr.py .github/workflows/patch-qr-ui.yml
          git add app.js scripts/patch_qr.py .github/workflows/patch-qr-ui.yml
          git commit -m "Add direct QR preview download"
          git push
